<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Horizon logo mark">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#21B8FF"/>
      <stop offset="55%" stop-color="#1477E8"/>
      <stop offset="100%" stop-color="#12366F"/>
    </linearGradient>
    <linearGradient id="horizon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#168BFF"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FF8A24"/>
    </linearGradient>
    <linearGradient id="leftPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#247FEA"/>
      <stop offset="100%" stop-color="#162F5D"/>
    </linearGradient>
    <linearGradient id="rightPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#355D91"/>
      <stop offset="100%" stop-color="#17233A"/>
    </linearGradient>
    <radialGradient id="sun">
      <stop offset="0%" stop-color="#FFF7D6"/>
      <stop offset="35%" stop-color="#FFB33D"/>
      <stop offset="100%" stop-color="#FF7A18" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <!-- Transparent background: icon only -->
  <!-- Outer arc -->
  <path d="M 180 395 A 220 220 0 0 1 620 395"
        fill="none" stroke="url(#sky)" stroke-width="42" stroke-linecap="round"/>

  <!-- Sunrise glow -->
  <circle cx="400" cy="404" r="78" fill="url(#sun)" filter="url(#glow)"/>
  <circle cx="400" cy="404" r="13" fill="#FFD47A"/>

  <!-- Horizon line -->
  <path d="M 120 475 Q 400 320 680 475"
        fill="none" stroke="url(#horizon)" stroke-width="12" stroke-linecap="round"/>

  <!-- Lower segmented form -->
  <path d="M 205 475
           Q 270 535 350 550
           L 350 690
           Q 255 670 190 585
           Z"
        fill="url(#leftPanel)"/>

  <path d="M 595 475
           Q 530 535 450 550
           L 450 690
           Q 545 670 610 585
           Z"
        fill="url(#rightPanel)"/>

  <!-- Small inner highlights -->
  <path d="M 215 493 Q 270 535 335 548"
        fill="none" stroke="#62B9FF" stroke-width="3" opacity=".75"/>
  <path d="M 585 493 Q 530 535 465 548"
        fill="none" stroke="#8CA8CC" stroke-width="3" opacity=".45"/>
</svg>
